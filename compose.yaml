name: agentclinic

services:
  volume-init:
    build:
      context: .
      dockerfile: containers/server.Dockerfile
      target: migration
    user: root
    command: ['sh', '-c', 'chown -R node:node /data']
    volumes:
      - clinic-data:/data
    restart: 'no'

  migrate:
    build:
      context: .
      dockerfile: containers/server.Dockerfile
      target: migration
    environment: &server-environment
      NODE_ENV: development
      DATABASE_URL: file:/data/agentclinic.db
      AGENTCLINIC_WEB_ORIGIN: http://localhost:3000
      AGENTCLINIC_TIME_ZONE: America/Sao_Paulo
      AGENTCLINIC_CANCELLATION_CUTOFF_HOURS: '24'
      AGENTCLINIC_HTTPS: 'false'
      AGENTCLINIC_TRUST_PROXY: 'false'
      AGENTCLINIC_SHUTDOWN_TIMEOUT_MS: '10000'
      AGENTCLINIC_INSTANCE_COUNT: '1'
      AGENTCLINIC_SQLITE_WRITER: single
    volumes:
      - clinic-data:/data
    depends_on:
      volume-init:
        condition: service_completed_successfully
    restart: 'no'

  seed:
    build:
      context: .
      dockerfile: containers/server.Dockerfile
      target: migration
    command: ['npm', 'run', 'db:seed']
    environment: *server-environment
    volumes:
      - clinic-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  server:
    build:
      context: .
      dockerfile: containers/server.Dockerfile
      target: runtime
    environment:
      <<: *server-environment
      PORT: '3001'
    ports:
      - '${AGENTCLINIC_SERVER_PORT:-3001}:3001'
    volumes:
      - clinic-data:/data
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    init: true
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: containers/web.Dockerfile
      target: runtime
      args:
        AGENTCLINIC_API_URL: http://server:3001
    environment:
      NODE_ENV: production
      PORT: '3000'
      AGENTCLINIC_API_URL: http://server:3001
      AGENTCLINIC_HTTPS: 'false'
    ports:
      - '${AGENTCLINIC_WEB_PORT:-3000}:3000'
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    init: true
    restart: unless-stopped

volumes:
  clinic-data:
    name: agentclinic-data
